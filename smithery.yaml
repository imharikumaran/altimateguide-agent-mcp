# Smithery configuration for the Altimateguide agent MCP server.
# https://smithery.ai/docs/config
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      altimateguideAgentToken:
        type: string
        description: >-
          Altimateguide account API token. Create one at
          https://altimateguide.com/account (Agent & API access).
      apiUrl:
        type: string
        description: >-
          Override the submission API base (default https://altimateguide.com).
    required:
      - altimateguideAgentToken
  commandFunction: |-
    (config) => ({
      command: "node",
      args: ["dist/index.js"],
      env: {
        ALTIMATEGUIDE_AGENT_TOKEN: config.altimateguideAgentToken,
        ALTIMATEGUIDE_API_URL: config.apiUrl ?? ""
      }
    })
