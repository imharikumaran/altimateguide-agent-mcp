# Publish altimateguide-agent-mcp to npm via Trusted Publishing (OIDC).
#
# There is NO NPM_TOKEN anywhere: the npm registry is configured to trust this
# exact GitHub repository + workflow, and gets a short-lived OIDC token at run
# time. Nothing to store, nothing to rotate, no OTP prompt.
#
# One-time setup on npm (must be done in the browser):
#   https://www.npmjs.com/package/altimateguide-agent-mcp
#     → Settings → Trusted Publisher → GitHub Actions
#       Organization or user: imharikumaran
#       Repository:           altimateguide-agent-mcp
#       Workflow filename:    publish.yml
#       Environment:          (leave blank)
#       Allowed actions:      enable "npm publish" (direct publishing).
#                             Connections created after 2026-09-03 default to
#                             stage-only and will reject plain `npm publish`
#                             with "OIDC permission denied for this action".
#
# This file must live at .github/workflows/publish.yml in the
# imharikumaran/altimateguide-agent-mcp repository (the repo named in
# package.json "repository"), NOT in the site repo.
#
# Releasing: bump "version" in package.json, commit + push, create a GitHub
# Release (or run this workflow manually from the Actions tab).
name: publish

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required: OIDC token for trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm >= 11.5.1, which knows about OIDC
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      # If triggered by a v* tag, the tag must match package.json.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag=${GITHUB_REF_NAME#v}
          if [ "$pkg" != "$tag" ]; then
            echo "::error::package.json version ($pkg) does not match tag ($tag)"
            exit 1
          fi

      # No --otp, no NODE_AUTH_TOKEN: npm authenticates via the OIDC id-token
      # and attaches provenance from the git/CI context automatically.
      - run: npm publish --access public
